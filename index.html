<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Spaces</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#ffffff; --bg2:#f6f6f4; --text:#1b1b1b; --muted:#6a6a66; --line:#e4e4e0;
  --accent:#1f5fbf; --accent-bg:#eaf1fb; --free:#1d7f4c; --free-bg:#e8f5ee;
  --busy:#b4461a; --busy-bg:#fbede6; --closed:#8a8a85;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header{height:56px;display:flex;align-items:center;gap:20px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand{font-weight:650;font-size:16px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--bg2);color:var(--text);font-weight:550}
.count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.context{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;text-align:right;line-height:1.3}
.context b{color:var(--text);font-weight:550}

/* Layout */
.app{display:grid;grid-template-columns:420px 1fr;height:calc(100% - 56px)}
#panel{overflow-y:auto;border-right:1px solid var(--line)}
#mapwrap{position:relative}
#map{position:absolute;inset:0;background:#efebe3}
.mapfail{display:flex;height:100%;align-items:center;justify-content:center;color:var(--muted);padding:24px;text-align:center}
.pad{padding:16px}

/* Filters */
.filters{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:7px 6px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--text);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--text);color:var(--text);font-weight:550}
.chip[aria-pressed="true"]::before{content:"✓ "}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.resulthead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;color:var(--muted);font-size:13px}
.resulthead select{padding:4px 6px}
.reset{background:none;border:0;color:var(--accent);padding:0;font-size:12px;justify-self:start}

/* List items */
.list{padding:4px 8px 16px}
.item{display:flex;align-items:flex-start;border-radius:var(--r)}
.item:hover{background:var(--bg2)}
.item-main{flex:1;text-align:left;background:none;border:0;padding:12px 8px 12px 10px;display:grid;gap:3px}
.name{font-weight:600}
.meta{color:var(--muted);font-size:13px}
.st{font-size:13px;font-weight:550}
.st.free{color:var(--free)} .st.busy{color:var(--busy)} .st.mine{color:var(--accent)} .st.closed{color:var(--closed)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:12px;color:var(--muted);background:var(--bg2);border-radius:6px;padding:1px 7px}
.item:hover .tag{background:#ecece8}
.tag.res{color:var(--accent);background:var(--accent-bg)}
.tag.no{color:var(--busy);background:var(--busy-bg)}
.star{background:none;border:0;padding:12px 10px;font-size:18px;color:var(--muted);line-height:1}
.star[aria-pressed="true"]{color:#c9930a}
.empty{color:var(--muted);padding:24px 16px;text-align:center}
.more{background:none;border:0;color:var(--accent);padding:4px 10px 12px;font-size:13px}

/* Shared detail styles */
.back{background:none;border:0;color:var(--accent);padding:0;margin-bottom:12px}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:14px;margin:20px 0 8px}
.art{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;margin-bottom:14px;background:var(--bg2)}
.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:6px;margin:-6px 0 14px}
.thumb{padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;width:58px;height:44px;background:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-pressed="true"]{border-color:var(--text)}
.item-main{display:flex !important;gap:12px;align-items:flex-start}
.itxt{display:grid;gap:3px;min-width:0}
.lthumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg2);overflow:hidden;display:block}
.lthumb svg{width:100%;height:100%;display:block}
.slot.soon{background:var(--bg2);border-color:var(--line);color:#a9a9a4;cursor:not-allowed}
.art .cap{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:4px}
.statuscard{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--bg2)}
.statuscard.free{background:var(--free-bg)} .statuscard.busy{background:var(--busy-bg)} .statuscard.mine{background:var(--accent-bg)}
.statuscard .big{font-size:16px;font-weight:600}
.statuscard.free .big{color:var(--free)} .statuscard.busy .big{color:var(--busy)} .statuscard.mine .big{color:var(--accent)}
.updated{font-size:12px;color:var(--muted);margin-top:2px}
.access{margin-top:10px;font-size:13px;font-weight:550}
.access.ok{color:var(--free)} .access.no{color:var(--busy)} .access.open{color:var(--muted);font-weight:400}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
.fact{background:var(--bg);padding:9px 12px}
.fact dt{font-size:12px;color:var(--muted)}
.fact dd{margin:0;font-weight:550}
.timeline{position:relative;height:26px;border-radius:6px;background:var(--free-bg);overflow:hidden}
.seg-b{position:absolute;top:0;bottom:0;background:#e2d6cf}
.seg-b.mine{background:var(--accent)}
.nowline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text)}
.tlabels{position:relative;height:18px;font-size:11px;color:var(--muted)}
.tlabels span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--text);background:var(--text);color:#fff;border-radius:var(--r);padding:10px 16px;font-weight:550}
.btn.ghost{background:none;color:var(--text);border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{flex:1}
.rowbtn{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:none;text-align:left}
.rowbtn:hover{background:var(--bg2)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.policy{margin-top:14px;padding:10px 12px;border:1px dashed #c9c9c3;border-radius:var(--r);font-size:13px}
.review{padding:12px 0;border-top:1px solid var(--line)}
.review .who{font-size:12px;color:var(--muted)}
.stars{color:#c9930a;letter-spacing:1px}
.bigrating{display:flex;align-items:baseline;gap:10px;margin:12px 0 8px}
.bigrating .num{font-size:32px;font-weight:650}

/* Booking */
.banner{margin-top:14px;padding:12px 14px;border-radius:var(--r);font-size:13px}
.banner b{display:block;font-size:14px;margin-bottom:2px}
.banner.ok{background:var(--free-bg);color:#165e39}
.banner.no{background:var(--busy-bg);color:#8a3613}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:none;border-radius:10px;padding:6px 0;display:grid;gap:1px;font-size:11px;color:var(--muted)}
.day b{font-size:16px;color:var(--text)}
.day[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.day[aria-pressed="true"] b{color:#fff}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.slots{display:grid;grid-template-columns:48px 1fr 1fr;gap:4px;margin-top:8px}
.hr{font-size:12px;color:var(--muted);align-self:center}
.slot{border:1px solid #cfe5d8;background:var(--free-bg);color:var(--free);border-radius:6px;padding:7px 0;font-size:12px}
.slot:hover{border-color:var(--free)}
.slot.booked{background:#f1ece8;border-color:#e6ddd6;color:#a08f84;cursor:not-allowed}
.slot.past,.slot.closed{background:var(--bg2);border-color:var(--line);color:#b5b5b0;cursor:not-allowed}
.slot.mine{background:var(--accent-bg);border-color:#bcd2f0;color:var(--accent);cursor:not-allowed}
.slot.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.form{display:grid;gap:12px;margin-top:16px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.check{display:flex !important;align-items:center;gap:8px;color:var(--text) !important}
.summary{padding:12px 14px;background:var(--bg2);border-radius:var(--r);font-size:13px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:4px;border-top:1px solid var(--line)}

/* Confirmation */
.done{font-size:28px;color:var(--free)}
.email{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.email .eh{background:var(--bg2);padding:10px 14px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.email .eh b{color:var(--text);font-weight:550}
.email .eb{padding:12px 14px;font-size:13px}
.email .eb p{margin:0 0 8px}
.demo{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:18px}

/* Bookings */
.bk{padding:14px 8px;border-top:1px solid var(--line);display:grid;gap:4px}
.bk:first-child{border-top:0}
.bk .actions{margin-top:8px;flex-wrap:wrap}
.bk .btn{padding:8px 12px}

/* Map */
.leaflet-container{background:#efebe3;font-family:inherit}
.pinwrap{background:none;border:0}
.street{position:absolute;white-space:nowrap;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#a59d8e;pointer-events:none}
.bpin{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--free);color:var(--text);font:600 12px/1 system-ui,sans-serif;padding:3px 3px 3px 9px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
.bpin b{background:var(--free);color:#fff;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;font-size:11px;padding:0 5px}
.bpin.none{border-color:var(--busy)} .bpin.none b{background:var(--busy)}
.bpin.sel{background:var(--text);border-color:var(--text);color:#fff}
.maplegend{position:absolute;left:12px;bottom:20px;z-index:500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.lg{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--free);margin-right:6px;vertical-align:-2px}
.lg.busy{background:var(--busy)}

/* Mobile */
.mtoggle{display:none}
@media (max-width:760px){
  header{gap:10px;padding:0 12px}
  .context{display:none}
  .app{grid-template-columns:1fr;height:calc(100% - 56px - 52px)}
  #panel{border-right:0}
  .app[data-view="list"] #mapwrap{display:none}
  .app[data-view="map"] #panel{display:none}
  .mtoggle{display:flex;position:fixed;left:0;right:0;bottom:0;height:52px;border-top:1px solid var(--line);background:var(--bg)}
  .mtoggle button{flex:1;background:none;border:0;color:var(--muted)}
  .mtoggle button[aria-pressed="true"]{color:var(--text);font-weight:600}
}
</style>
</head>
<body>
<header>
  <div class="brand">Study Spaces</div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="context" id="context"></div>
</header>
<main class="app" id="app" data-view="list">
  <section id="panel" aria-live="polite"></section>
  <section id="mapwrap" aria-label="Campus map">
    <div id="map"></div>
    <div class="maplegend" aria-hidden="true">
      <div>Tap a building to see its spaces</div>
      <div><span class="lg"></span>Number = matching spaces</div>
      <div><span class="lg busy"></span>None available right now</div>
      <div style="font-size:11px">Simplified campus map</div>
    </div>
  </section>
</main>
<nav class="mtoggle" id="mtoggle" aria-label="View">
  <button data-mview="list" aria-pressed="true">List</button>
  <button data-mview="map" aria-pressed="false">Map</button>
</nav>

    amenities:["Natural light"], open:[7,22], updated:3, photos:["images/forestry1-1.jpg","images/forestry1-2.jpg"], rating:4.4, reviewCount:57,
    reviews:[{who:"4th-year",r:5,t:"Beautiful atrium, but basically every seat is taken by noon.",d:"4 days ago"},
             {who:"Anonymous",r:4,t:"Outlets only near the busiest tables.",d:"2 weeks ago"}] },
];

/* ============ App state ============ */
const DEFAULT_F = { q:"", type:"all", now:false, outlets:false, noise:"any", seating:"any", group:1, walk:0, sort:"distance" };
const state = {
  tab:"find", stack:[],                        // stack of screens: {screen, roomId?, bid?, all?}
  f:{...DEFAULT_F},
  saved:new Set(["x237","woodquiet"]),     // pre-saved for the "check a known space" task
  bookings:[], draft:null, lastId:null, view:"list", note:""
};
const cur = () => state.stack[state.stack.length-1] || null;
const NOISE=["quiet","low","moderate","high"];
const byId = id => ROOMS.find(r => r.id === id);
const bld = id => BUILDINGS.find(b => b.id === id);
const LABEL = {
  seating:{tables:"Tables", desks:"Individual desks", soft:"Soft seating", counter:"Counter seating"},
  noise:{quiet:"Quiet", low:"Low noise", moderate:"Moderate noise", high:"Loud"},
  outlets:{many:"Many outlets", some:"Some outlets", few:"Few outlets", none:"No outlets"}
};

/* ============ Dates and times ============ */
const DAYS = Array.from({length:7}, (_,i) => { const d=new Date(BASE); d.setDate(d.getDate()+i); return d; });
const wk = i => DAYS[i].toLocaleDateString("en-US",{weekday:"short"});
const weekday = i => DAYS[i].toLocaleDateString("en-US",{weekday:"long"});
const dateShort = i => DAYS[i].toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
const dayName = i => i===0 ? "Today" : i===1 ? "Tomorrow" : dateShort(i);
function fmt(m){ let h=Math.floor(m/60), mm=m%60; const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(mm).padStart(2,"0")+" "+ap; }
function fmtShort(m){ let h=Math.floor(m/60); const ap=h>=12?"p":"a"; h=h%12||12; return h+ap; }
function fmtHour(m){ let h=Math.floor(m/60); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+" "+ap; }
function fmtLen(m){ return m<60 ? m+" min" : (m/60)+(m===60?" hr":" hrs"); }

/* ============ Helpers ============ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function seeded(str){
  let h=2166136261; for (const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); }
  return () => { h=Math.imul(h^(h>>>15),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
function walkB(b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-USER.lat), dLng=rad(b.lng-USER.lng);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(USER.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return Math.max(1, Math.round(2*R*Math.asin(Math.sqrt(a))*1.3/80));   // 1.3 detour factor, ~80 m/min
}
const walk = r => walkB(bld(r.bid));
function stars(n){ const f=Math.round(n); return "★".repeat(f)+"☆".repeat(5-f); }
function eligible(r){
  const a=r.access; if (!a) return true;
  if (a.programs) return a.programs.includes(USER.program);
  if (a.residence) return USER.residence===a.residence;
  return true;
}

/* Bookings by others: day 0 from the data above, later days generated so every day looks realistic. */
const _gen={};
function baseBookings(r, day){
  if (day===0) return r.bookings||[];
  const key=r.id+"|"+day;
  if (!_gen[key]){
    const rnd=seeded(key), out=[], c=r.open[1];
    let t=r.open[0]+Math.floor(rnd()*2);
    if (r.classes){ out.push([H(r.classes[0]),H(r.classes[1])]); t=r.classes[1]+1; }
    while (t<c-1){
      if (rnd()<0.42){ const e=Math.min(c, t+1+Math.floor(rnd()*3)); out.push([H(t),H(e)]); t=e+1; }
      else t+=1+Math.floor(rnd()*2);
    }
    _gen[key]=out;
  }
  return _gen[key];
}
function intervals(r, day, skipId){
  const base=baseBookings(r,day).map(([s,e])=>({s,e,mine:false}));
  const mine=state.bookings.filter(b=>b.roomId===r.id && b.day===day && b.id!==skipId).map(b=>({s:b.start,e:b.end,mine:true,b}));
  return base.concat(mine).sort((a,b)=>a.s-b.s);
}

function status(r){
  const o=r.open[0]*60, c=r.open[1]*60;
  const typeLine = r.bookable ? `Reservable · fits ${r.capacity}` : "Drop-in · first come, first served";
  if (NOW<o || NOW>=c) return {key:"closed", avail:false, text:"Closed now", type:typeLine};
  if (!r.bookable){
    return r.seatsFree>0
      ? {key:"free", avail:true, text:`${r.seatsFree} of ${r.capacity} seats free`, type:typeLine}
      : {key:"busy", avail:false, text:"Full right now", type:typeLine};
  }
  const iv=intervals(r,0), now=iv.find(i=>i.s<=NOW && NOW<i.e);
  if (now){
    if (now.mine){
      const b=now.b;
      return {key:"mine", avail:false, type:typeLine,
        text: b.checkedIn ? `Checked in · yours until ${fmt(b.end)}` : `Reserved for you · check in by ${fmt(b.start+10)}`};
    }
    let end=now.e, grew=true;
    while (grew){ grew=false; for (const i of iv) if (i.s<=end && i.e>end){ end=i.e; grew=true; } }
    return {key:"busy", avail:false, text:`Booked until ${fmt(end)}`, type:typeLine};
  }
  const next=iv.find(i=>i.s>NOW);
  return {key:"free", avail:true, text:`Free until ${fmt(next?Math.min(next.s,c):c)}`, type:typeLine};
}
function seatsNow(r){ return r.bookable ? (status(r).avail ? r.capacity : 0) : r.seatsFree; }
function updatedLine(r){
  return r.bookable ? `Updated ${r.updated} min ago · from booking records`
                    : `Updated ${r.updated} min ago · estimated from check-ins`;
}

function filtered(){
  const f=state.f, q=f.q.trim().toLowerCase();
  const list=ROOMS.filter(r=>{
    const b=bld(r.bid);
    if (q && !(r.name+" "+b.name+" "+b.short).toLowerCase().includes(q)) return false;
    if (f.type==="book" && !(r.bookable && eligible(r))) return false;
    if (f.type==="drop" && r.bookable) return false;
    if (f.now && !status(r).avail) return false;
    if (f.outlets && r.outlets==="none") return false;
    if (f.noise!=="any" && NOISE.indexOf(r.noise) > NOISE.indexOf(f.noise)) return false;
    if (f.seating!=="any" && r.seating!==f.seating) return false;
    if (f.group>1 && (r.bookable ? r.capacity : r.seatsFree) < f.group) return false;
    if (f.walk && walk(r)>f.walk) return false;
    return true;
  });
  const sorts={ distance:(a,b)=>walk(a)-walk(b), seats:(a,b)=>seatsNow(b)-seatsNow(a), rating:(a,b)=>b.rating-a.rating };
  return list.sort(sorts[f.sort]);
}
const filtersActive = () => JSON.stringify({...state.f, sort:""}) !== JSON.stringify({...DEFAULT_F, sort:""});

/* Simple drawn picture of the room (stand-in for a real photo). */
function artSVG(r){
  const rnd=seeded(r.id), walls=["#e9e4da","#e2e7ea","#ece5df","#e4e8df"], wall=walls[Math.floor(rnd()*4)];
  const has=a=>r.amenities.includes(a), light=has("Natural light");
  let s=`<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><rect width="320" height="180" fill="${wall}"/><rect y="122" width="320" height="58" fill="#cbbda6"/>`;
  s+=`<rect x="22" y="22" width="${light?120:70}" height="${light?82:62}" fill="#cfe3f1" stroke="#fff" stroke-width="4"/>`;
  if (has("Whiteboard")) s+=`<rect x="160" y="30" width="78" height="52" fill="#fbfbfb" stroke="#b9b9b9" stroke-width="2"/><path d="M172 46h40M172 56h52M172 66h30" stroke="#7a9ccc" stroke-width="2"/>`;
  if (has("Screen")||has("Projector")) s+=`<rect x="250" y="34" width="54" height="34" rx="2" fill="#2b2f36"/>`;
  if (r.seating==="tables"){
    [86,132,178,224].forEach(x=>{ s+=`<rect x="${x}" y="106" width="22" height="26" rx="4" fill="#4d5d6e"/>`; });
    s+=`<polygon points="70,130 256,130 276,152 50,152" fill="#8a6a4a"/><rect x="62" y="152" width="6" height="20" fill="#6b5039"/><rect x="258" y="152" width="6" height="20" fill="#6b5039"/>`;
  } else if (r.seating==="desks"){

  } else {
    s+=`<rect x="50" y="112" width="150" height="40" rx="10" fill="#7f9584"/><rect x="40" y="120" width="20" height="40" rx="8" fill="#6d8372"/><rect x="190" y="120" width="20" height="40" rx="8" fill="#6d8372"/><rect x="60" y="134" width="130" height="20" rx="6" fill="#91a796"/><rect x="226" y="142" width="64" height="9" rx="3" fill="#8a6a4a"/>`;

/* --- Booking --- */
function slotState(r, day, t, skipId){
  if (t >= r.open[1]*60 || t < r.open[0]*60) return "closed";
  if (day===0 && t+30 <= NOW) return "past";
  if (r.rules && r.rules.advance && day*1440+t < NOW + r.rules.advance) return "soon";
  const hit=intervals(r,day,skipId).find(i=>i.s<t+30 && t<i.e);
  if (!hit) return "free";
  return hit.mine ? "mine" : "booked";
}
function rangeFree(r, day, a, b, skipId){
  for (let t=a; t<=b; t+=30) if (slotState(r,day,t,skipId)!=="free") return false;
  return true;
}
function selRange(d){
  if (!d.sel) return null;
  const start = d.day===0 ? Math.max(d.sel.a, NOW) : d.sel.a, end = d.sel.b+30;
  return {start, end, len:end-start};
}
function renderBook(){
  const d=state.draft, r=byId(d.roomId), ok=eligible(r);
  const head = `<div class="pad">
    <button class="back" data-back>← Back</button>
    <h1>${d.resched?"Reschedule":"Book"} ${esc(r.name)}</h1>
    <div class="meta">${esc(bld(r.bid).name)} · fits ${r.capacity}</div>`;
  if (!ok){
    panel.innerHTML = head + `
      <div class="banner no"><b>You can't book this room</b>
        This room is for ${esc(r.access.label.replace(/ only$/,"").toLowerCase())}. You're signed in as a ${esc(USER.program)} student.</div>
      <div class="actions">
        <button class="btn wide" data-bld="${r.bid}">Other rooms in ${esc(bld(r.bid).short)}</button>
        <button class="btn ghost" data-findbook>Rooms I can book</button>
      </div></div>`;
    return;
  }
  const o=r.open[0]*60, c=r.open[1]*60, rg=selRange(d);
  let grid="";
  const first = d.day===0 ? Math.max(o, Math.floor(NOW/60)*60) : o;
  for (let h=first; h<c; h+=60){
    grid += `<div class="hr">${fmtHour(h)}</div>`;
    for (const t of [h, h+30]){
      const st=slotState(r,d.day,t,d.resched), on=d.sel && t>=d.sel.a && t<=d.sel.b;
      const label = st==="booked"?"Booked" : st==="mine"?"Yours" : st==="soon"?"Too soon" : st==="past"||st==="closed"?"–" : fmt(t).replace(" PM","").replace(" AM","");
      grid += `<button class="slot ${st} ${on?"sel":""}" data-slot="${t}" ${st==="free"?"":"aria-disabled=\"true\""} aria-label="${fmt(t)} ${st}">${label}</button>`;
    }
  }
  panel.innerHTML = head + `
    <div class="banner ok"><b>✓ You can book this room</b>
      ${r.access ? esc(r.access.label)+" · you're a "+esc(USER.program)+" student." : "Anyone at UBC can book this room."} Up to 3 hours per booking.
      ${rulesText(r)?`<div style="margin-top:4px"><b style="display:inline;font-size:13px">Rules:</b> ${esc(rulesText(r))}.</div>`:""}</div>
    <h2>Day</h2>
    <div class="meta" style="margin-bottom:6px">${DAYS[d.day].toLocaleDateString("en-US",{month:"long",year:"numeric"})}</div>
    <div class="days">${DAYS.map((x,i)=>`<button class="day" data-day="${i}" aria-pressed="${i===d.day}"><span>${i===0?"Today":wk(i)}</span><b>${x.getDate()}</b></button>`).join("")}</div>
    <h2>Time</h2>
    <p class="hint">Tap a start time, then tap an end time.${d.day===0 && first>o?" Earlier times today have passed.":""}</p>
    <div class="legend"><span><i class="sw" style="background:var(--free-bg);border:1px solid #cfe5d8"></i>Free</span>
      <span><i class="sw" style="background:#f1ece8;border:1px solid #e6ddd6"></i>Booked</span>
      <span><i class="sw" style="background:var(--accent)"></i>Your selection</span></div>
    <div class="slots">${grid}</div>
    ${state.note?`<p class="hint" style="color:var(--busy)">${esc(state.note)}</p>`:""}
    <div class="form">
      <label>Group size
        <select data-d="size">${Array.from({length:r.capacity},(_,i)=>i+1).filter(n=>n>=minGroup(r)).map(n=>`<option value="${n}" ${n===d.size?"selected":""}>${n===1?"Just me":n+" people"}</option>`).join("")}</select></label>
      <label class="check"><input type="checkbox" data-d="weekly" ${d.weekly?"checked":""}> Repeat every ${weekday(d.day)}</label>
    </div>
    <div class="sticky">
      <div class="summary">${rg
        ? `<b>${dayName(d.day)}${d.day>1?"":", "+DAYS[d.day].toLocaleDateString("en-US",{month:"short",day:"numeric"})} · ${fmt(rg.start)} – ${fmt(rg.end)}</b> (${fmtLen(rg.len)})${d.weekly?" · every week":""}<br>Check in by ${fmt(rg.start+10)} or the room is released.`
        : "No time selected yet."}</div>
      <div class="actions" style="margin-top:10px"><button class="btn wide" data-confirm ${rg?"":"disabled"}>${d.resched?"Confirm new time":"Confirm booking"}</button></div>
    </div>
  </div>`;
}
const minGroup = r => (r.rules && r.rules.minGroup) || 1;
function firstOpenDay(r){
  for (let d=0; d<7; d++) for (let t=r.open[0]*60; t<r.open[1]*60; t+=30) if (slotState(r,d,t)==="free") return d;
  return 0;
}
function tapSlot(t){
  const d=state.draft, r=byId(d.roomId); state.note="";
  if (slotState(r,d.day,t,d.resched)!=="free") return;
  const s=d.sel;
  if (s && s.a===s.b && t===s.a) d.sel=null;
  else if (s && s.a===s.b && t>s.a){
    if (!rangeFree(r,d.day,s.a,t,d.resched)) { d.sel={a:t,b:t}; state.note="That range overlaps a booking, so we started a new selection."; }
    else if (t+30-s.a > MAX_BOOKING) { d.sel={a:t,b:t}; state.note="Bookings can be up to 3 hours, so we started a new selection."; }
    else d.sel={a:s.a,b:t};
  }
  else d.sel={a:t,b:t};
  const y=panel.scrollTop; render(); panel.scrollTop=y;
}

/* --- Confirmation --- */
function renderConfirm(){
  const b=state.bookings.find(x=>x.id===state.lastId), r=byId(b.roomId), bd=bld(r.bid);
  const when=`${dateShort(b.day)}, ${fmt(b.start)} – ${fmt(b.end)}`, canCheck=b.day===0 && b.start<=NOW;
  panel.innerHTML = `<div class="pad">
    <button class="back" data-back>← Back</button>
    <div class="done" aria-hidden="true">✓</div>
    <h1>${b.rescheduled?"Booking updated":"You're booked"}</h1>
    <div class="meta">${esc(r.name)} · ${esc(bd.name)}</div>
    <div class="statuscard free" style="margin-top:12px">
      <div class="big">${when}</div>
      <div class="meta">${b.size} ${b.size===1?"person":"people"}${b.weekly?" · repeats every "+weekday(b.day):""}</div>
    </div>
    <div class="policy">Check in within 10 minutes of your start time (by ${fmt(b.start+10)}). If you don't, the room is released to other students.</div>
    <div class="actions">
      ${b.checkedIn ? `<span class="st free" style="align-self:center">Checked in · room marked as occupied</span>`
        : canCheck ? `<button class="btn wide" data-checkin="${b.id}">Check in now</button>` : ""}
      <button class="btn ghost ${canCheck||b.checkedIn?"":"wide"}" data-tab="bookings">My bookings</button>
    </div>
    <div class="demo">Email preview · demo only, nothing is sent</div>
    <div class="email">
      <div class="eh"><span>From: <b>Study Spaces</b></span><span>To: ${esc(USER.cwl)}@student.ubc.ca</span><span>Subject: <b>Booking confirmed: ${esc(r.name)}, ${when}</b></span></div>
      <div class="eb">
        <p>Hi ${esc(USER.name.split(" ")[0])},</p>
        <p>Your booking for <b>${esc(r.name)}</b> (${esc(bd.name)}) is confirmed for <b>${when}</b>${b.weekly?", repeating every week":""}.</p>
        <p>Please check in on the app within 10 minutes of your start time. If you don't, the room is released so other students can use it.</p>
        <p>Plans changed? Reschedule or cancel from My bookings so someone else can take the room.</p>
      </div>
    </div>
  </div>`;
}

/* --- My bookings --- */
function bookingStateHTML(b){
  if (b.checkedIn) return `<span class="st free">Checked in · room marked as occupied</span>`;
  if (b.day===0 && b.start<=NOW) return `<span class="st mine">Check-in open until ${fmt(b.start+10)}</span>`;
  return `<span class="st closed">Check-in opens ${b.day===0?"at":dayName(b.day)+" at"} ${fmt(b.start)}</span>`;
}
function renderBookings(){
  const list=[...state.bookings].sort((a,b)=>a.day-b.day || a.start-b.start);
  panel.innerHTML = `<div class="pad"><h1>My bookings</h1>
    <div class="meta">Check in within 10 minutes of your start time, or the room is released to other students.</div></div>
    <div class="pad" style="padding-top:0">${list.length ? list.map(b=>{ const r=byId(b.roomId); return `
      <div class="bk">
        <span class="name">${esc(r.name)}</span>
        <span class="meta">${dayName(b.day)} · ${fmt(b.start)} – ${fmt(b.end)}${b.weekly?" · repeats weekly":""} · ${b.size} ${b.size===1?"person":"people"}</span>
        ${bookingStateHTML(b)}
        <div class="actions">
          ${!b.checkedIn && b.day===0 && b.start<=NOW?`<button class="btn" data-checkin="${b.id}">Check in</button>`:""}
          ${!b.checkedIn?`<button class="btn ghost" data-resched="${b.id}">Reschedule</button>`:""}
          <button class="btn ghost" data-open="${r.id}">View room</button>
          <button class="btn ghost" data-cancel="${b.id}">${b.checkedIn?"End early":"Cancel"}</button>
        </div>
      </div>`;}).join("") : `<div class="empty">No bookings yet. Book a room from Find, Saved, or the map.</div>`}</div>`;
}

function render(){
  renderTabs();
  const c=cur();
  if (!c){
    if (state.tab==="saved") renderSaved();
    else if (state.tab==="bookings") renderBookings();
    else renderFind();
  }
  else if (c.screen==="building") renderBuilding(c);
  else if (c.screen==="room") renderRoom(c);
  else if (c.screen==="reviews") renderReviews(c);
  else if (c.screen==="book") renderBook();
  else if (c.screen==="confirm") renderConfirm();
  updateMarkers();
  panel.scrollTop=0;
}

/* ============ Map ============ */
let map=null; const markers={};
function visibleIds(){
  if (state.tab==="saved") return ROOMS.filter(r=>state.saved.has(r.id)).map(r=>r.id);
  if (state.tab==="bookings") return [...new Set(state.bookings.map(b=>b.roomId))];
  return filtered().map(r=>r.id);
}
function bpinIcon(b, n, ok, sel){
  return L.divIcon({ className:"pinwrap", iconSize:[0,0],
    html:`<div class="bpin ${ok?"":"none"} ${sel?"sel":""}">${esc(b.short)}<b>${n}</b></div>` });
}
function updateMarkers(){
  if (!map) return;
  const by={}; visibleIds().forEach(id=>{ const r=byId(id); (by[r.bid]=by[r.bid]||[]).push(r); });
  const c=cur(), selB = c && (c.screen==="building" ? c.bid : c.roomId ? byId(c.roomId).bid : null);
  if (selB && !by[selB]) by[selB]=ROOMS.filter(r=>r.bid===selB);
  BUILDINGS.forEach(b=>{
    const list=by[b.id], m=markers[b.id];
    if (list){
      m.setIcon(bpinIcon(b, list.length, list.some(r=>status(r).avail), b.id===selB));
      m.setZIndexOffset(b.id===selB?1000:0);
      if (!map.hasLayer(m)) m.addTo(map);
    } else if (map.hasLayer(m)) map.removeLayer(m);
  });
}

/* Schematic UBC map. UBC's grid is rotated, so streets are drawn in a local frame:
   u = metres along Main Mall (towards the south-east), v = metres across it (towards the north-east),
   with Koerner Library at (0,0). */
const ORIGIN=[49.26905,-123.25535], M_E=72700, M_N=111200;
const AU=[0.4476,-0.8943], AV=[0.8943,0.4476];
function uv(u,v){ const e=u*AU[0]+v*AV[0], n=u*AU[1]+v*AV[1]; return [ORIGIN[0]+n/M_N, ORIGIN[1]+e/M_E]; }
function toUV(lat,lng){ const e=(lng-ORIGIN[1])*M_E, n=(lat-ORIGIN[0])*M_N; return [e*AU[0]+n*AU[1], e*AV[0]+n*AV[1]]; }
// [name, start [u,v], end [u,v], major?, label position [u,v]]
const STREETS=[
  ["Main Mall",            [-300,-35],[1350,-35], true,  [560,-35]],
  ["East Mall",            [-300,160],[1350,160], true,  [820,160]],
  ["West Mall",            [-300,-195],[1350,-195],false,[560,-195]],
  ["Health Sciences Mall", [490,240],[1350,240],  false, [880,240]],
  ["Wesbrook Mall",        [-300,430],[1350,430], true,  [600,430]],
  ["Agricultural Rd",      [110,-195],[110,160],  false, [110,-120]],
  ["Student Union Blvd",   [355,160],[355,720],   false, [355,560]],
  ["University Blvd",      [490,-35],[490,720],   true,  [490,340]],
  ["Agronomy Rd",          [1052,-330],[1052,720],true,  [1052,560]],
];
function rect(u,v,hu,hv){ return [uv(u-hu,v-hv),uv(u-hu,v+hv),uv(u+hu,v+hv),uv(u+hu,v-hv)]; }
function textIcon(text, angle){
  return L.divIcon({className:"pinwrap", iconSize:[0,0],
    html:`<div class="street" style="transform:translate(-50%,-50%) rotate(${angle}deg)">${esc(text)}</div>`});
}
function drawCampus(){
  STREETS.forEach(([,a,b,major])=>{
    const pts=[uv(...a),uv(...b)];
    L.polyline(pts,{color:"#d9d3c7",weight:major?11:8,interactive:false,lineCap:"butt"}).addTo(map);
    L.polyline(pts,{color:"#ffffff",weight:major?8:5,interactive:false,lineCap:"butt"}).addTo(map);
  });
  STREETS.forEach(([name,a,b,,lab])=>{
    L.marker(uv(...lab),{icon:textIcon(name, a[0]===b[0] ? -26.6 : 63.4),interactive:false,keyboard:false,zIndexOffset:-2000}).addTo(map);
  });
  BUILDINGS.concat([{lat:USER.lat,lng:USER.lng,small:true}]).forEach(b=>{
    const [u,v]=toUV(b.lat,b.lng);
    L.polygon(rect(u,v,32,b.small?24:32),{color:"#cdc6b8",weight:1,fillColor:"#e4dfd5",fillOpacity:1,interactive:false}).addTo(map);
  });
}
function fitCampus(){ if (map) map.fitBounds(L.latLngBounds(BUILDINGS.map(b=>[b.lat,b.lng]).concat([[USER.lat,USER.lng]])), {padding:[40,40]}); }
let fittedOnShow=false;
function initMap(){
  const el=document.getElementById("map");
  if (!window.L){ el.innerHTML='<div class="mapfail">The map needs an internet connection to load. The list still works.</div>'; return; }
  const BOUNDS=L.latLngBounds([uv(-300,-330),uv(-300,720),uv(1350,-330),uv(1350,720)]);
  map=L.map(el,{zoomControl:true, attributionControl:false, maxBounds:BOUNDS.pad(0.05), maxBoundsViscosity:1,
                minZoom:15, maxZoom:18, zoomSnap:0.5});
  drawCampus();
  fitCampus();
  L.circleMarker([USER.lat,USER.lng],{radius:7,color:"#fff",weight:2,fillColor:"#1f5fbf",fillOpacity:1})
    .addTo(map).bindTooltip("You · "+USER.loc,{permanent:true,direction:"right",offset:[8,0]});
  BUILDINGS.forEach(b=>{
    markers[b.id]=L.marker([b.lat,b.lng],{icon:bpinIcon(b,0,true,false),title:b.name,keyboard:true})
      .on("click",()=>openBuilding(b.id, true));
  });
}

/* ============ Navigation and actions ============ */
function go(s){ state.stack.push(s); state.note=""; render(); }
function back(){ state.stack.pop(); state.note=""; render(); }
function setView(v){
  state.view=v;
  document.getElementById("app").dataset.view=v;
  document.querySelectorAll("#mtoggle button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mview===v));
  if (v==="map" && map) setTimeout(()=>{ map.invalidateSize(); if (!fittedOnShow){ fitCampus(); fittedOnShow=true; } },0);
}
function openBuilding(bid, fromMap){
  if (fromMap) state.stack=[];
  go({screen:"building", bid});
  setView("list");
  if (map) map.panTo([bld(bid).lat, bld(bid).lng]);
}
function openRoom(id){ go({screen:"room", roomId:id}); setView("list"); }
function startBooking(roomId, existing){
  const r=byId(roomId);
  state.draft = existing
    ? { roomId, day:existing.day, sel:{a:Math.floor(existing.start/30)*30, b:existing.end-30}, size:existing.size, weekly:existing.weekly, resched:existing.id }
    : { roomId, day:firstOpenDay(r), sel:null, size:Math.max(minGroup(r),Math.min(state.f.group,r.capacity)), weekly:false, resched:null };
  go({screen:"book", roomId});
}
function toggleSave(id){
  state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id);
  if (state.tab==="find" && !cur()) renderResults(); else { const y=panel.scrollTop; render(); panel.scrollTop=y; }
}
function confirmBooking(){
  const d=state.draft, rg=selRange(d); if (!rg) return;
  let b;
  if (d.resched){
    b=state.bookings.find(x=>x.id===d.resched);
    Object.assign(b,{day:d.day,start:rg.start,end:rg.end,size:d.size,weekly:d.weekly,checkedIn:false,rescheduled:true});
  } else {
    b={ id:"b"+Date.now(), roomId:d.roomId, day:d.day, start:rg.start, end:rg.end, size:d.size, weekly:d.weekly, checkedIn:false };
    state.bookings.push(b);
  }
  state.lastId=b.id;
  state.stack.pop();                 // replace the booking screen with the confirmation
  go({screen:"confirm", roomId:d.roomId});
}

document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if (!t) return;
  const d=t.dataset;
  if (d.tab){ state.tab=d.tab; state.stack=[]; render(); }
  else if (d.mview){ setView(d.mview); }
  else if (d.back!==undefined){ back(); }
  else if (d.open){ openRoom(d.open); }
  else if (d.bld){ go({screen:"building", bid:d.bld}); }
  else if (d.allb!==undefined){ cur().all=true; render(); }
  else if (d.save){ toggleSave(d.save); }
  else if (d.photo){ cur().photo=Number(d.photo); const y=panel.scrollTop; render(); panel.scrollTop=y; }
  else if (d.reviews){ go({screen:"reviews", roomId:d.reviews}); }
  else if (d.book){ startBooking(d.book); }
  else if (d.findbook!==undefined){ state.tab="find"; state.stack=[]; state.f={...DEFAULT_F, type:"book"}; render(); }
  else if (d.day){ const dr=state.draft; dr.day=Number(d.day); dr.sel=null; state.note=""; const y=panel.scrollTop; render(); panel.scrollTop=y; }
  else if (d.slot){ tapSlot(Number(d.slot)); }
  else if (d.confirm!==undefined){ confirmBooking(); }
  else if (d.f){ state.f[d.f]=d.v; renderFind(); }
  else if (d.toggle){ state.f[d.toggle]=!state.f[d.toggle]; renderFind(); }
  else if (d.reset!==undefined){ state.f={...DEFAULT_F}; renderFind(); }
  else if (d.checkin){ const b=state.bookings.find(x=>x.id===d.checkin); if (b) b.checkedIn=true; render(); }
  else if (d.resched){ startBooking(state.bookings.find(x=>x.id===d.resched).roomId, state.bookings.find(x=>x.id===d.resched)); }
  else if (d.cancel){ state.bookings=state.bookings.filter(x=>x.id!==d.cancel); render(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if (t.dataset.fsel){ state.f[t.dataset.fsel] = ["group","walk"].includes(t.dataset.fsel) ? Number(t.value) : t.value; renderResults(); }
  else if (t.dataset.d){
    const k=t.dataset.d; state.draft[k] = k==="weekly" ? t.checked : Number(t.value);
    const y=panel.scrollTop; render(); panel.scrollTop=y;
  }
});

initMap();
render();
</script>
